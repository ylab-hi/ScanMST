[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "scannls"
version = "0.1.3"
description = "A non-colinear transcript caller for long-read transcriptome sequencing data"
authors = [
  { name = "Yangyang Li", email = "<yangyang.li@northwestern.edu>" },
  { name = "Ting-You Wang", email = "<tywang@northwestern.edu>" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "biopython>=1.81",
  "HTSeq",               # In recent versions of HTSeq, a bug affecting the GenomicArrayOfSets
  "pyfaidx>=0.8.1",
  "psutil>=6.0.0",
  "loguru>=0.7.0",
  "rich>=14.0.0",
  "networkx>=3.2",
  "pybind11>=3.0.0",
  "pyabpoa>=1.5.3",
  "alignparse>=0.7.1",
  "matplotlib>=3.9",
  "pyvis>=0.3.2",
  "intervaltree>=3.1.0",
  "pysam==0.23.3",
]

[project.urls]
changelog = "https://github.com/ylab-hi/ScanNLS/releases"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
documentation = "https://scannls.readthedocs.io"

[project.optional-dependencies]
vis = ["matplotlib", "pyvis"]

[project.scripts]
scannclt = "scannls.__main__:main"

[tool.scikit-build]
# Your package lives under src/
wheel.packages = ["src/scannls"]
# (Optional) make the sdist include your C/C++ sources explicitly
sdist.include = [
  "src/scannls/cppext/src/**",
  "src/scannls/cppext/bindings/**",
  "src/scannls/cppext/include/**",
  "CMakeLists.txt",
]
# (Optional) speed up rebuilds
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CONDA_PREFIX = { env = "CONDA_PREFIX" }

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]

[tool.ruff]
line-length = 150
exclude = ["tests", "cppext", "blat.py"]
target-version = "py310"

[tool.ruff.lint]
fixable = ["ALL"]

select = [
  # "ANN",
  # "D",
  "A",
  "F",
  "E",
  "W",
  "C90",
  "I",
  "UP",
  "N",
  "YTT",
  "TID",
  "S",
  "BLE",
  "FBT",
  "PLR",
  "B",
  "B9",
  "A",
  "C4",
  "T10",
  "EM",
  "ICN",
  "T20",
  "Q",
  "RET",
  "SIM",
  "ARG",
  "DTZ",
  "ERA",
  "PD",
  "PGH",
  "PLC",
  "PLE",
  "PLW",
  "RUF",
  "PL",
  "TD",
  "FIX",
  "PTH",
  "TCH",
  "SLOT",
  "PT",
  "PYI",
  "PIE",
  "ISC",
  "FA",
  "EXE",
  # "CPY",
  "COM",
]

ignore = [
  "ANN001",
  "D203",
  "D213",
  "PGH003",
  "PLR0911", # Too many return statements
  "PLR0913", # Too many arguments to function call
  "PLR0912", # Too many branches
  "PLR0915", # Too many statements
  "DTZ005",  # Without `tz` argument
  "C901",    # Too complex
  'PLC0415',
  # formater conflict
  'COM812',
  'COM819',
  'D206',
  'ISC001',
  'Q000',
  'Q001',
  'Q002',
  'Q003',
  'W191',
  "PLR0904",
]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
# magic-trailing-comma = "respect"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint.per-file-ignores]
"src/scannls/cli/main.py" = ["ARG001"]
"src/scannls/cli/helper.py" = ["PLR2004", "RET505"]
"src/scannls/writer/writer.py" = ["A003"]
"src/scannls/writer/fasta_writer.py" = ["A003"]
"src/scannls/writer/vcf_writer.py" = ["A003", "DTZ002"]
"src/scannls/writer/gtf_writer.py" = ["A003"]
"src/scannls/base/parallel.py" = ["A003"]
"src/scannls/base/basic.py" = ["A003"]
"src/scannls/utils.py" = ["S603"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
major_version_zero = true

[dependency-groups]
dev = [
  "coverage>=7.10.3",
  "ipdb>=0.13.13",
  "mypy>=1.17.1",
  "nox>=2025.5.1",
  "pre-commit>=4.3.0",
  "pynvim>=0.5.2",
  "pytest>=8.4.1",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "typeguard>=4.4.4",
]
