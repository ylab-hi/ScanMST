[project]
name = "scanmst"
version = "0.1.9"
description = "A multi-segment transcript caller for long-read transcriptome sequencing data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ting-You Wang", email = "tywang@northwestern.edu" },
    { name = "Yangyang Li", email = "yangyang.li@northwestern.edu" },
]
# Upper bound is set by pysam==0.19.0, which ships no wheels above cp310.
# Raising it requires bumping the pysam pin -- see the dependency note below.
requires-python = ">=3.9,<3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    # No "License ::" classifier: PEP 639 SPDX expression is used instead,
    # and the two are mutually exclusive.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "biopython>=1.81,<2",
    # pysam and HTSeq are pinned exactly: these are the versions the published
    # v0.1.9 results were produced with. pysam==0.19.0 also caps requires-python
    # at <3.11 (no cp311/cp312 wheels).
    "pysam==0.19.0",
    # In recent versions of HTSeq, a bug affecting the GenomicArrayOfSets
    "HTSeq==2.0.5",
    "pyfaidx>=0.8.1,<0.9",
    "psutil>=7.0.0,<8",
    "loguru>=0.7.0,<0.8",
    "rich>=14.0.0,<16",
    "networkx>=3.2,<4",
    "pyabpoa>=1.5.3,<2",
    "alignparse>=0.7.1,<0.8",
    "matplotlib>=3.9,<4",
    "intervaltree>=3.1.0,<4",
    "numpy==1.26.4",
    "joblib>=1.5.0,<2",
    # Both were previously undeclared and arrived only transitively:
    #   src/scanmst/base/helper.py imports yaml
    #   src/scanmst/blat/__init__.py imports requests
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# matplotlib is a mandatory dependency, so it is not repeated here.
vis = ["pyvis>=0.3.2,<0.4"]

[project.scripts]
scanmst = "scanmst.__main__:main"

[project.urls]
Homepage = "https://github.com/ylab-hi/ScanMST"
Repository = "https://github.com/ylab-hi/ScanMST"
Documentation = "https://ylab-hi.github.io/ScanMST/"
Changelog = "https://github.com/ylab-hi/ScanMST/releases"
Issues = "https://github.com/ylab-hi/ScanMST/issues"

[dependency-groups]
test = [
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
    "coverage[toml]>=7.6",
    "pygments>=2.17.2",
    "typeguard>=4.3.0",
    "xdoctest[colors]>=1.1.3",
]
lint = [
    "ruff>=0.12.1",
    "codespell>=2.2.2",
    "bandit>=1.7.3",
    "pre-commit>=4.0.1",
    "pre-commit-hooks>=5.0.0",
]
typing = ["mypy>=1.10"]
# NOTE: no `security` group here, and do not add one. The audit runs from
# noxfile.py's `safety` session, which installs pip-audit into its own venv, so
# a declared group would only pull an auditing tool's transitive tree -- nltk
# among them. nltk has an open cluster of advisories and no fix reachable from
# here: the patched line needs Python >= 3.10, this project supports 3.9, and
# GHSA-8mgp-746c-j5xp / CVE-2026-81726 has no patched release at all.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10",
]
build = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12,<4",
    "cmake>=3.18",
    "ninja>=1.11",
    "pybind11-stubgen>=2.5",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    { include-group = "build" },
    "nox>=2025.2.9",
    "commitizen>=4.2",
    "ipdb>=0.13.11",
    "pynvim>=0.5.0",
    "tqdm>=4.67.1",
]


[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
allow_untyped_calls = true
ignore_missing_imports = true

# Type debt inherited from the series->nlpath refactor; the tests were not the
# only thing left behind. Error counts at the time of writing (mypy 3.10):
#   base/read_connector.py 55, graph/basic_graph.py 32, base/helper.py 21,
#   base/basic.py 18, graph/nlgraph.py 11, graph/sr_rescuer.py 10.
# These are muted so CI gates on real regressions; drop modules from this list
# one at a time as they are cleaned up.
# requests ships no inline types; stubs live in the separate types-requests
# distribution, which is not a runtime dependency of this project.
[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "scanmst.base.read_connector",
    "scanmst.base.helper",
    "scanmst.graph.basic_graph",
    "scanmst.graph.nlgraph",
    "scanmst.graph.sr_rescuer",
]
ignore_errors = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]

[tool.bandit]
exclude_dirs = ['tests']
skips = ["B602", "B404", "B603"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 150
exclude = ["tests", "cppext", "blat.py"]
target-version = "py39"


[tool.ruff.lint]
fixable = ["ALL"]

select = [
    # "ANN",
    # "D",
    "A",
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "N",
    "YTT",
    "TID",
    "S",
    "BLE",
    "FBT",
    "PLR",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ICN",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "DTZ",
    "ERA",
    "PD",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "PL",
    "TD",
    "FIX",
    "PTH",
    "TCH",
    "SLOT",
    "PT",
    "PYI",
    "PIE",
    "ISC",
    "FA",
    "EXE",
    # "CPY",
    "COM",
]

ignore = [
    "ANN001",
    "D203",
    "D213",
    "PGH003",
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "DTZ005",  # Without `tz` argument
    "C901",    # Too complex
    'PLC0415',
    # formater conflict
    'COM812',
    'COM819',
    'D206',
    'ISC001',
    'Q000',
    'Q001',
    'Q002',
    'Q003',
    'W191',
    "PLR0904",
    # Preview-only siblings of the complexity rules already ignored above. The
    # pre-commit ruff hook runs with --preview, which is the only reason these
    # surface; the repo has consistently opted out of complexity limits.
    "PLR0914", # Too many local variables
    "PLR0916", # Too many boolean expressions
    "PLR0917", # Too many positional arguments
    "PLR1702", # Too many nested blocks
    # Pre-existing findings in src/ that need an API or semantic decision rather
    # than a mechanical edit -- counts at the time of writing:
    #   PLR2004 magic values 9, FBT001 6, FBT002 3 (booleans would have to become
    #   keyword-only), PLW1641 3 (__eq__ without __hash__), PTH116/PTH123 3,
    #   ARG001/ARG002 3, and one each of S404, PLW3201, PLW0603, PLR6301, BLE001.
    # Enable these one at a time as the call sites are cleaned up.
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "BLE001",  # Blind except
    "FBT001",  # Boolean-typed positional argument
    "FBT002",  # Boolean default positional argument
    "PLR2004", # Magic value in comparison
    "PLR6301", # Method could be a function/staticmethod
    "PLW0603", # global statement
    "PLW1641", # __eq__ without __hash__
    "PLW3201", # Dunder without special meaning
    "PTH116",  # os.stat -> Path.stat
    "PTH123",  # open -> Path.open
    "S404",    # subprocess import (bandit already skips B404 here)
]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
# magic-trailing-comma = "respect"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint.per-file-ignores]
"src/scanmst/cli/main.py" = ["ARG001"]
"src/scanmst/cli/helper.py" = ["PLR2004", "RET505"]
"src/scanmst/writer/writer.py" = ["A003"]
"src/scanmst/writer/fasta_writer.py" = ["A003"]
"src/scanmst/writer/vcf_writer.py" = ["A003", "DTZ002"]
"src/scanmst/writer/gtf_writer.py" = ["A003"]
"src/scanmst/base/parallel.py" = ["A003"]
"src/scanmst/base/basic.py" = ["A003"]
"src/scanmst/utils.py" = ["S603"]
# Build/CI helper scripts are console tools; printing is their output.
"scripts/*.py" = ["T201"]
"example/*.py" = ["T201"]

[tool.commitizen]
name = "cz_conventional_commits"
# Every real tag is v0.1.0 .. v0.1.9, so the previous "$version" never matched.
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
major_version_zero = true

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/scanmst"]

# Defence in depth. These all live inside src/scanmst/ and are .gitignore'd,
# but do not rely on scikit-build-core's gitignore-awareness alone: the old
# poetry build shipped scanmst/blat/{linux,darwin}/* (12 UCSC BLAT binaries,
# downloaded at runtime) into the wheel for exactly this reason.
wheel.exclude = [
    "scanmst/blat/linux/**",
    "scanmst/blat/darwin/**",
    "**/__pycache__/**",
    "**/.omc/**",
    "scanmst/cppext/src/main.cpp",
]

# Scoped to source extensions rather than `**`: a bare `**` force-includes
# everything under the directory, overriding sdist.exclude and sweeping in
# untracked scratch dirs.
sdist.include = [
    "CMakeLists.txt",
    "src/scanmst/cppext/src/*.c",
    "src/scanmst/cppext/src/*.cpp",
    "src/scanmst/cppext/include/*.h",
    "src/scanmst/cppext/include/*.hpp",
    "src/scanmst/cppext/bindings/*.c",
    "src/scanmst/cppext/bindings/*.cpp",
]
sdist.exclude = [
    "build/",
    "site/",
    "data/",
    "dependency/",
    "tmp/",
    ".serena/",
    ".ruff_cache/",
    # Must be depth-agnostic: sdist.include force-includes everything under
    # src/scanmst/cppext/**, which otherwise sweeps in nested scratch dirs.
    "**/.omc/**",
    "**/__pycache__/**",
]

[tool.scikit-build.cmake]
version = ">=3.18"

[tool.scikit-build.cmake.define]
# `default = ""` is required: without it scikit-build-core errors out when the
# variable is unset. With it, CMake receives -DCONDA_PREFIX="" and CMakeLists
# treats the empty string as unset, producing the intended FATAL_ERROR.
CONDA_PREFIX = { env = "CONDA_PREFIX", default = "" }
HTSLIB_ROOT = { env = "HTSLIB_ROOT", default = "" }
# cibuildwheel sets this to OFF so auditwheel owns the RPATH: an embedded
# RPATH pointing at the build container's /usr/local/lib is meaningless on a
# user's machine.
SCANMST_EMBED_RPATH = { env = "SCANMST_EMBED_RPATH", default = "ON" }

[tool.cibuildwheel]
# Linux x86_64 only. macOS is excluded because pysam==0.19.0 ships no arm64
# wheel, so Apple Silicon could never resolve the dependency chain, and
# macos-latest runners are arm64.
build = ["cp39-manylinux_x86_64", "cp310-manylinux_x86_64"]
# glibc 2.28 (RHEL 8 / Ubuntu 20.04+). manylinux2014 would reach further back
# but its CentOS 7 base is EOL and its package repos are unreliable.
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash scripts/build-htslib.sh"
# Exercise the compiled extension, not just the import shim.
test-command = 'python -c "from scanmst import cppext; r = cppext.parseCigar(\"10M5I20M\"); assert r.ref_match == 30, r.ref_match; print(\"cppext OK\")" && scanmst --version'

[tool.cibuildwheel.environment]
HTSLIB_ROOT = "/usr/local"
SCANMST_EMBED_RPATH = "OFF"
# auditwheel needs to locate libhts.so.3 to bundle it; with the RPATH off
# there is nothing else pointing at the install prefix.
LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64"
