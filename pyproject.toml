[tool.poetry]
name = "scannls"
version = "0.1.0"
description = "A non-colinear transcript caller for long-read transcriptome sequencing data"
authors = [
    "Yangyang Li <yangyang.li@northwestern.edu>",
    "Ting-You Wang <tywang@northwestern.edu>",
]
license = "GPL"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
documentation = "https://scannls.readthedocs.io"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
exclude = ["src/scannls/cppext/cmake-*"]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.9"
biopython = "^1.81"
pysam = "0.19.0"
HTSeq = "^2.0.4"
pyfaidx = "^0.8.1"
psutil = "^5.9.5"
loguru = "^0.7.0"
rich = "^13.7.0"
networkx = "^3.2"
pybind11 = "^2.13.6"
matplotlib = { version = "^3.8" }
pyvis = { version = "^0.3.2", optional = true }
maturin = { version = "^1.3.2", optional = true }
intervaltree = "^3.1.0"

[tool.poetry.extras]
vis = ["matplotlib", "pyvis"]
rust = ["maturin"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.poetry.scripts]
scannls = "scannls.__main__:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.6"
codespell = "^2.2.2"
ipdb = "^0.13.11"
isort = "^5.12.0"
pytest = "^7.4.3"
coverage = { extras = ["toml"], version = "^7.3" }
safety = "^2.1.1"
mypy = "^1.7"
typeguard = "^4.1.5"
xdoctest = { extras = ["colors"], version = "^1.2.0" }
sphinx = "^7.2.6"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^3.3.3"
flake8 = "^6.1.0"
black = "^23.3"
bandit = "^1.7.3"
flake8-bandit = ">=4.1"
flake8-bugbear = "^23.9.16"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.3.0"
pep8-naming = "^0.13.2"
reorder-python-imports = "^3.8.2"
pre-commit-hooks = "^5.0.0"
sphinx-rtd-theme = "^1.3.0"
sphinx-click = "^5.0.1"
Pygments = "^2.17.1"
pytest-mock = "^3.14.0"
nox = "^2024.10.9"
flake8-broken-line = "^1.0.0"
flake8-comprehensions = "^3.13.0"
flake8-eradicate = "^1.5.0"
flake8-simplify = "^0.21.0"
pynvim = "^0.5.0"
flake8-2020 = "^1.8.1"
flake8-alfred = "^1.1.1"
cohesion = "^1.0.0"
tqdm = "^4.66.6"
wily = "^1.24.2"
altair = "^5.2.0"
seaborn = "^0.13.2"
aquarel = "^0.0.5"


[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
allow_untyped_calls = true
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]

[tool.bandit]
exclude_dirs = ['tests']
skips = ["B602", "B404", "B603"]

[tool.isort]
profile = "black"

[tool.ruff]
select = [
    # "ANN",
    # "D",
    "A",
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "N",
    "YTT",
    "TID",
    "S",
    "BLE",
    "FBT",
    "PLR",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ICN",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "DTZ",
    "ERA",
    "PD",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "PL",
    "TD",
    "FIX",
    "PTH",
    "TCH",
    "SLOT",
    "PT",
    "PYI",
    "PIE",
    "ISC",
    "FA",
    "EXE",
    # "CPY",
    "COM",
]
line-length = 150
exclude = ["tests", "cppext", "blat.py"]
ignore = [
    "ANN001",
    "D203",
    "D213",
    "PGH003",
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "DTZ005",  # Without `tz` argument
    "C901",    # Too complex
    'PLC0415',
    # formater conflict
    'COM812',
    'COM819',
    'D206',
    'ISC001',
    'Q000',
    'Q001',
    'Q002',
    'Q003',
    'W191',
    "PLR0904",
]
target-version = "py39"


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
# magic-trailing-comma = "respect"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"


[tool.ruff.lint.per-file-ignores]
"src/scannls/cli/main.py" = ["ARG001"]
"src/scannls/cli/helper.py" = ["PLR2004", "RET505"]
"src/scannls/writer/writer.py" = ["A003"]
"src/scannls/writer/fasta_writer.py" = ["A003"]
"src/scannls/writer/vcf_writer.py" = ["A003", "DTZ002"]
"src/scannls/writer/gtf_writer.py" = ["A003"]
"src/scannls/base/parallel.py" = ["A003"]
"src/scannls/base/basic.py" = ["A003"]
"src/scannls/utils.py" = ["S603"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
major_version_zero = true

[build-system]
requires = ["pybind11>2.9.1", "poetry-core>=1.6.0", "setuptools>=68.0.0"]
build-backend = "poetry.core.masonry.api"
