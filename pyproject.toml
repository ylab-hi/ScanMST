[tool.poetry]
name = "scannls"
version = "0.0.1"
description = "Graph algorithm is used to detected non-linear transcripts in long-read data"
authors = [
    "Yangyang Li <yangyang.li@northwestern.edu>",
    "Ting-You Wang <tingyou.wang@northwestern.edu>",
]
license = "GPL"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
# documentation = "https://ScanNLS.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Beta",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
exclude = ["src/scannls/cppext/cmake-*"]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.79"
pysam = "0.19.0"
HTSeq = "2.0.2"
pyfaidx = "^0.7.1"
psutil = "^5.9.1"
loguru = "^0.6.0"
rich = "^12.5.1"
networkx = "^2.8"
pybind11 = "^2.10.0"
matplotlib = { version = "^3.7.2", optional = true }
pyvis = { version = "^0.3.2", optional = true }
maturin = { version = "^1.1.0", optional = true }
intervaltree = "^3.1.0"

[tool.poetry.extras]
vis = ["matplotlib", "pyvis"]
rust = ["maturin"]

[tool.poetry.group.dev.dependencies]
codespell = "^2.2.2"
ipdb = "^0.13.11"
isort = "^5.12.0"
pytest = "^7.1.2"
coverage = { extras = ["toml"], version = "^6.4" }
safety = "^2.1.1"
mypy = "^0.991"
typeguard = "^2.12.1"
xdoctest = { extras = ["colors"], version = "^1.0.2" }
sphinx = "^5.1.1"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^2.20.0"
flake8 = "^5.0.4"
black = "^22.6"
bandit = "^1.7.3"
flake8-bandit = ">=4.1"
flake8-bugbear = "^22.9.11"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.2.6"
pep8-naming = "^0.13.2"
reorder-python-imports = "^3.8.2"
pre-commit-hooks = "^4.3.0"
sphinx-rtd-theme = "^0.5.2"
sphinx-click = "^4.3.0"
Pygments = "^2.13.0"
pytest-mock = "^3.8.2"
nox = "^2022.8.7"
flake8-broken-line = "^0.5.0"
flake8-comprehensions = "^3.10.0"
flake8-eradicate = "^1.3.0"
flake8-simplify = "^0.19.3"
pynvim = "^0.4.3"
flake8-2020 = "^1.6.1"
flake8-alfred = "^1.1.1"
cohesion = "^1.0.0"
tqdm = "^4.64.0"
wily = "^1.24.2"


[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.poetry.scripts]
scannls = "scannls.__main__:main"

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
allow_untyped_calls = true
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]

[tool.bandit]
exclude_dirs = ['tests']
skips = ["B602", "B404", "B603"]

[tool.isort]
profile = "black"

[tool.ruff]
select = [
    # "ANN",
    # "D",
    "A",
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "N",
    "YTT",
    "TID",
    "S",
    "BLE",
    "FBT",
    "PLR",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ICN",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "DTZ",
    "ERA",
    "PD",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "PL",
    "TD",
    "FIX",
    "PTH",
    "TCH",
    "SLOT",
    "PT",
    "PYI",
    "PIE",
    "ISC",
    "FA",
    "EXE",
    "CPY",
    "COM",
]
line-length = 130
exclude = ["tests", "cppext", "blat.py"]
ignore = [
    "ANN001",
    "D203",
    "D213",
    "PGH003",
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "DTZ005",  # Without `tz` argument
    "C901",    # Too complex

]
target-version = "py39"

[tool.ruff.per-file-ignores]
"src/scannls/cli/main.py" = ["ARG001"]
"src/scannls/cli/helper.py" = ["PLR2004", "RET505"]
"src/scannls/writer/writer.py" = ["A003"]
"src/scannls/writer/fasta_writer.py" = ["A003"]
"src/scannls/writer/vcf_writer.py" = ["A003", "DTZ002"]
"src/scannls/writer/gtf_writer.py" = ["A003"]
"src/scannls/base/parallel.py" = ["A003"]
"src/scannls/base/basic.py" = ["A003"]
"src/scannls/utils.py" = ["S603"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
major_version_zero = true

[build-system]
requires = ["pybind11>2.9.1", "poetry-core>=1.6.0", "setuptools>=68.0.0"]
build-backend = "poetry.core.masonry.api"
