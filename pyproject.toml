[tool.poetry]
name = "scannls"
version = "0.0.1"
description = "ScanNLS"
authors = ["Ting-You Wang <tywang@umn.edu>", "Yangyang Li <li002252@umn.edu>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
# documentation = "https://ScanNLS.readthedocs.io"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]
exclude = ["src/scannls/cppext/cmake-*"]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.81"
pysam = "0.19.0"
HTSeq = "^2.0.2"
pyfaidx = "^0.7.2"
psutil = "^5.9.5"
loguru = "^0.7.0"
rich = "^13.4.2"
networkx = "^3.0"
pybind11 = "^2.10.4"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
coverage = { extras = ["toml"], version = "^7.2" }
safety = "^2.1.1"
mypy = "^1.4"
typeguard = "^4.0.0"
xdoctest = { extras = ["colors"], version = "^1.0.2" }
sphinx = "^6.2.1"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^3.3.3"
flake8 = "^5.0.4"
black = "^23.3"
bandit = "^1.7.3"
flake8-bandit = ">=4.1"
flake8-bugbear = "^23.3.12"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.3.0"
pep8-naming = "^0.13.2"
darglint = "^1.8.0"
reorder-python-imports = "^3.10.0"
pre-commit-hooks = "^4.3.0"
sphinx-rtd-theme = "^1.2.2"
sphinx-click = "^4.3.0"
Pygments = "^2.15.1"
pytest-mock = "^3.11.1"
nox = "^2023.4.22"
flake8-broken-line = "^0.6.0"
flake8-comprehensions = "^3.14.0"
flake8-eradicate = "^1.5.0"
flake8-simplify = "^0.20.0"
pynvim = "^0.4.3"
flake8-2020 = "^1.8.1"
flake8-alfred = "^1.1.1"
cohesion = "^1.1.0"
tqdm = "^4.65.0"

[tool.poetry.build]
script = "build.py"

[tool.poetry.scripts]
scannls = "scannls.__main__:main"

[tool.poetry.group.dev.dependencies]
codespell = "^2.2.5"

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
allow_untyped_calls = true
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]


[tool.bandit]
exclude_dirs = ['tests']
skips = ["B602", "B404", "B603"]

[build-system]
requires = ["pybind11>2.9.1", "poetry-core>=1.0.0", "setuptools>=40.6.0"]
build-backend = "poetry.core.masonry.api"
