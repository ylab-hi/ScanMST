[tool.poetry]
name = "scannls"
version = "0.0.1"
description = "ScanNLS"
authors = ["Ting-You Wang <tywang@umn.edu>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
# documentation = "https://ScanNLS.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.79"
pysam = "^0.18.0"
HTSeq = "^0.13.5"
pyfaidx = "^0.6.3"
psutil = "^5.8.0"
loguru = "^0.5.3"
pynvim = "^0.4.3"
rich = "^10.14.0"
tqdm = "^4.62.3"
networkx = "^2.6.3"

[tool.poetry.dev-dependencies]
pytest = "^6.2.4"
coverage = {extras = ["toml"], version = "^5.4"}
safety = "^1.10.3"
mypy = "^0.910"
typeguard = "^2.12.1"
xdoctest = {extras = ["colors"], version = "^0.15.5"}
sphinx = "^4.1.1"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^2.13.0"
flake8 = "^3.9.2"
black = "^20.8b1"
flake8-bandit = "^2.1.2"
flake8-bugbear = "^21.4.3"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.2.3"
pep8-naming = "^0.12.0"
darglint = "^1.8.0"
reorder-python-imports = "^2.5.0"
pre-commit-hooks = "^4.0.1"
sphinx-rtd-theme = "^0.5.2"
sphinx-click = "^3.0.1"
Pygments = "^2.9.0"
pytest-mock = "^3.6.1"
nox = "^2021.10.1"

[tool.poetry.scripts]
ScanNLS = "scannls.__main__:main"

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "call|isoform"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
