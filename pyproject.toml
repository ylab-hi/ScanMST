[tool.poetry]
name = "scannls"
version = "0.0.1"
description = "ScanNLS"
authors = ["Ting-You Wang <tywang@umn.edu>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
# documentation = "https://ScanNLS.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.79"
pysam = "^0.18.0"
HTSeq = "^0.13.5"
pyfaidx = "^0.6.4"
psutil = "^5.9.0"
loguru = "^0.6.0"
pynvim = "^0.4.3"
rich = "^10.14.0"
tqdm = "^4.62.3"
networkx = "^2.6.3"
parasail = "^1.2.4"
pybind11 = "^2.9.0"
edlib = "^1.3.9"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"
coverage = {extras = ["toml"], version = "^6.3"}
safety = "^1.10.3"
mypy = "^0.931"
typeguard = "^2.12.1"
xdoctest = {extras = ["colors"], version = "^0.15.5"}
sphinx = "^4.4.0"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^2.17.0"
flake8 = "^3.9.2"
black = "^22.1"
flake8-bandit = "^2.1.2"
flake8-bugbear = "^22.1.11"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.2.5"
pep8-naming = "^0.12.0"
darglint = "^1.8.0"
reorder-python-imports = "^2.7.1"
pre-commit-hooks = "^4.1.0"
sphinx-rtd-theme = "^0.5.2"
sphinx-click = "^3.1.0"
Pygments = "^2.11.0"
pytest-mock = "^3.7.0"
nox = "^2022.1.7"
flake8-broken-line = "^0.4.0"
flake8-comprehensions = "^3.7.0"
flake8-eradicate = "^1.2.0"
flake8-simplify = "^0.14.2"

#[tool.poetry.build]
#script = "build.py"

[tool.poetry.scripts]
scannls = "scannls.__main__:main"
scannls-simulator = "scannls.simulator.__main__:main"

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
#exclude = "simulator"
allow_untyped_calls = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
