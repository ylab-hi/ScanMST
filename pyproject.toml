[tool.poetry]
name = "scannls"
version = "0.0.1"
description = "ScanNLS"
authors = ["Ting-You Wang <tywang@umn.edu>", "Yangyang Li <li002252@umn.edu>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ylab-hi/ScanNLS"
repository = "https://github.com/ylab-hi/ScanNLS"
# documentation = "https://ScanNLS.readthedocs.io"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]
exclude = ["src/scannls/cppext/cmake-*"]

[tool.poetry.urls]
Changelog = "https://github.com/ylab-hi/ScanNLS/releases"

[tool.poetry.dependencies]
python = "^3.8"
biopython = "^1.79"
pysam = "0.19.0"
HTSeq = "^2.0.2"
pyfaidx = "^0.7.1"
psutil = "^5.9.1"
loguru = "^0.6.0"
rich = "^12.5.1"
networkx = "^2.8"
pybind11 = "^2.10.0"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"
coverage = { extras = ["toml"], version = "^6.4" }
safety = "^2.1.1"
mypy = "^0.971"
typeguard = "^2.12.1"
xdoctest = { extras = ["colors"], version = "^1.0.1" }
sphinx = "^5.1.1"
sphinx-autobuild = "^2021.3.14"
pre-commit = "^2.20.0"
flake8 = "^3.9.2"
black = "^22.6"
flake8-bandit = "^2.1.2"
bandit = "1.7.2"
flake8-bugbear = "^22.7.1"
flake8-docstrings = "^1.6.0"
flake8-rst-docstrings = "^0.2.6"
pep8-naming = "^0.13.1"
darglint = "^1.8.0"
reorder-python-imports = "^3.8.2"
pre-commit-hooks = "^4.3.0"
sphinx-rtd-theme = "^0.5.2"
sphinx-click = "^4.3.0"
Pygments = "^2.12.0"
pytest-mock = "^3.8.2"
nox = "^2022.8.7"
flake8-broken-line = "^0.4.0"
flake8-comprehensions = "^3.10.0"
flake8-eradicate = "^1.3.0"
flake8-simplify = "^0.19.3"
pynvim = "^0.4.3"
flake8-2020 = "^1.6.1"
flake8-alfred = "^1.1.1"
cohesion = "^1.0.0"
tqdm = "^4.64.0"

[tool.poetry.build]
script = "build.py"

[tool.poetry.scripts]
scannls = "scannls.__main__:main"

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
allow_untyped_calls = true
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["cppext"]


[build-system]
requires = ["pybind11>2.9.1", "poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
