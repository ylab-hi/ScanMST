name: Release

# Step 3 of the PyPI/bioconda migration: publishes to PyPI via Trusted
# Publishing (OIDC) -- no stored token, no username/password. Triggers on
# `v*` tags, same as wheels.yml used to.
#
# Requires a one-time manual action on PyPI (only the maintainer can do this):
# add a pending publisher at https://pypi.org/manage/account/publishing/
#   PyPI project name : scanmst
#   Owner              : ylab-hi
#   Repository name    : ScanMST
#   Workflow name       : release.yml
#   Environment name    : pypi
#
# workflow_dispatch takes a required confirm_version input rather than
# relying on the ref: dispatch always runs against a branch (there is no tag
# to read a version from), and the first real release is exactly this case --
# tag v0.1.9 is the immutable manuscript-provenance anchor and predates this
# workflow file entirely (it was pushed against the old poetry-based
# release.yml, which has no workflow_dispatch trigger), so it can never be the
# dispatch target. The first PyPI upload of 0.1.9 is therefore built from
# main at its current state, not from that tag's commit.
#
# PyPI uploads are permanent and a filename can never be reused, so:
#   * check-version gates the whole run on the confirmed version matching
#     pyproject.toml, before any build or publish step runs.
#   * the publish job has no checkout and does nothing but download the
#     already-checked build artifacts and hand them to `uv publish` -- it is
#     the only job with `id-token: write`, so its surface is kept minimal.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to publish (must match pyproject.toml) -- there is no tag to check on a manual dispatch, so this is the confirmation"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-version:
    name: Verify version matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compare expected version to pyproject.toml
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            EXPECTED_VERSION="${CONFIRM_VERSION}"
          else
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          fi
          PROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::expected version $EXPECTED_VERSION does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi
          echo "confirmed: publishing version $PROJECT_VERSION"

  build:
    name: Build distributions
    needs: check-version
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scanmst/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish dist/*
