name: Release

# DISARMED pending Step 3 of the PyPI/bioconda migration.
#
# This previously ran on every push to a release* branch and drove
# `poetry build` + pypa/gh-action-pypi-publish. Poetry is no longer the build
# backend, and no PyPI credentials or Trusted Publishing are configured yet,
# so an automatic trigger could only fail -- or, worse, publish an unverified
# artifact. PyPI uploads are permanent and a filename can never be reused.
#
# Step 3 restores automatic release by adding PyPI Trusted Publishing (OIDC)
# and `uv publish`, and by building manylinux/macOS wheels via cibuildwheel
# (Step 2). Until then this is manual-only and builds artifacts without
# uploading them anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install htslib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhts-dev zlib1g-dev
          echo "HTSLIB_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Build sdist and wheel
        run: uv build

      # NOTE: this wheel is tagged linux_x86_64 and links the system libhts.
      # PyPI rejects such wheels, and they are not portable. Step 2 replaces
      # this with cibuildwheel + auditwheel to produce manylinux wheels with
      # htslib bundled.
      - name: Upload distributions as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
