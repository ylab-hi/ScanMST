name: Wheels

# Builds the distributions that get published to PyPI.
#
# Nothing is uploaded to an index here -- artifacts only. release.yml calls
# this workflow via `workflow_call` on `v*` tags and owns the publish step,
# so the build has no access to the OIDC token (`id-token: write` lives only
# on the publish job in release.yml).
#
# No longer triggers on tag push itself: release.yml does, and calls this
# workflow, so a separate tag trigger here would build everything twice.
# workflow_dispatch stays for ad-hoc manual builds (artifacts only, no publish).
#
# Kept off push/pull_request deliberately: cibuildwheel rebuilds htslib from
# source for every interpreter, which is far too slow for ordinary CI. tests.yml
# already covers the plain build on every commit.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: manylinux wheels (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # htslib is built inside the manylinux container by
      # scripts/build-htslib.sh via cibuildwheel's before-all; the runner
      # itself needs nothing. See [tool.cibuildwheel] in pyproject.toml.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0

      - name: Check wheel shape and bundled libraries
        run: python scripts/check_wheel.py wheelhouse/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install htslib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhts-dev zlib1g-dev
          echo "HTSLIB_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      # `uv build` (not `--sdist`) also builds a wheel *from* the sdist, so a
      # green run here proves the sdist is self-contained -- i.e. that
      # sdist.include covers every CMake/C++ input. That is what bioconda
      # (Step 4) will consume. Only the sdist is uploaded below: this wheel is
      # tagged linux_x86_64 and links the runner's system libhts, so PyPI
      # would reject it and it is not portable -- the publishable wheels come
      # from the job above.
      - name: Build sdist and verify it builds a wheel
        run: uv build

      - name: Check the sdist-derived wheel
        run: python scripts/check_wheel.py --no-bundled-libs dist/*.whl

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
