name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    name: ${{ matrix.session }} ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Capped at 3.10 by the pysam==0.19.0 pin (no cp311/cp312 wheels),
        # matching requires-python in pyproject.toml. The previous matrix also
        # ran 3.8, which was already below the declared floor.
        include:
          - { python-version: "3.10", os: ubuntu-latest, session: "pre-commit" }
          - { python-version: "3.10", os: ubuntu-latest, session: "safety" }
          - { python-version: "3.10", os: ubuntu-latest, session: "mypy" }
          - { python-version: "3.9", os: ubuntu-latest, session: "mypy" }
          - { python-version: "3.10", os: ubuntu-latest, session: "tests" }
          - { python-version: "3.9", os: ubuntu-latest, session: "tests" }
          - { python-version: "3.10", os: ubuntu-latest, session: "typeguard" }
          # No macOS entry: macos-latest runners are arm64 and pysam==0.19.0
          # ships no arm64 wheel, so the job could only fail. The package
          # declares Linux-only classifiers for the same reason.

    env:
      NOXSESSION: ${{ matrix.session }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The _cppext extension links against htslib and zlib. Nothing installed
      # them before, so the compiled build had never actually run in CI.
      # HTSLIB_ROOT is the non-conda entry point into CMakeLists.
      - name: Install htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhts-dev zlib1g-dev
          echo "HTSLIB_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Install htslib (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install htslib
          echo "HTSLIB_ROOT=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Nox
        run: uv run --group dev nox --force-color --python=${{ matrix.python-version }}

      - name: Upload coverage data
        if: always() && matrix.session == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python-version }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # `uv run --group dev` builds the project, and the _cppext extension links
      # against htslib, so this job needs it just as the test matrix does. The
      # job only ever ran as "skipped" before, which kept this hidden.
      - name: Install htslib (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhts-dev zlib1g-dev
          echo "HTSLIB_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Download coverage data
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data and display human readable report
        run: uv run --group dev nox --force-color --session=coverage

      - name: Create coverage report
        run: uv run --group dev nox --force-color --session=coverage -- xml -i

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
